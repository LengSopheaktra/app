name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate native iOS project (includes pod install)
        run: npx expo prebuild --platform ios --clean

      - name: Build unsigned iOS app
        working-directory: ios
        run: |
          SCHEME=$(xcodebuild -workspace *.xcworkspace -list -json | python3 -c "import sys, json; data=json.load(sys.stdin); print(data['workspace']['schemes'][0])")
          echo "Building scheme: $SCHEME"
          xcodebuild clean build \
            -workspace *.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found!"
            exit 1
          fi
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q NotifyMe.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NotifyMe-ipa
          path: NotifyMe.ipa
